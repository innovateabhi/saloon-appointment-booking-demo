server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your domain or EC2 Public IP

    # Root directory for Frontend SPA built files
    root /var/www/aurelia-salon/frontend/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Client body size for salon file uploads
    client_max_body_size 25M;

    # 1. API Endpoints passed to PHP-FPM Backend
    location ^~ /api/ {
        # Point to backend/public/index.php
        root /var/www/aurelia-salon/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            # Ubuntu 22.04 / 24.04 PHP 8.2 or 8.3 FPM socket
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/aurelia-salon/backend/public/index.php;
            include fastcgi_params;
            fastcgi_read_timeout 120;
        }
    }

    # 2. Public Uploaded Files (Avatars, Gallery, Portfolio)
    location ^~ /uploads/ {
        alias /var/www/aurelia-salon/backend/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Frontend Static Assets Caching
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 4. Frontend Single Page Application (SPA) Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

