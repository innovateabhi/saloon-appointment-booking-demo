<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background luxury deep espresso gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2420"/>
      <stop offset="100%" stop-color="#181311"/>
    </linearGradient>
    
    <!-- Luminous Champagne to Warm Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="30%" stop-color="#E2CCA8"/>
      <stop offset="70%" stop-color="#B89A70"/>
      <stop offset="100%" stop-color="#8A6E46"/>
    </linearGradient>

    <!-- Subtle luxury gold glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#B89A70" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Luxury Dark Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#B89A70" stroke-width="2.5" stroke-opacity="0.75"/>

  <!-- Delicate inner golden border -->
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="#E5D2B8" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Elegant Serif Letter 'A' -->
  <g filter="url(#goldGlow)">
    <!-- Main A vector path -->
    <path d="M 64 26 L 39 89 L 49 89 L 55 73.5 L 73 73.5 L 79 89 L 89 89 Z M 64 43 L 71 65.5 L 57 65.5 Z" 
          fill="url(#goldGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="0.8" 
          stroke-linejoin="round"/>
    
    <!-- Luxury serifs on legs and apex -->
    <line x1="35" y1="89" x2="52" y2="89" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="89" x2="93" y2="89" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="59" y1="26" x2="69" y2="26" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Luxury Atelier Sparkle Star (top-right) -->
  <g transform="translate(88, 28)">
    <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Small diamond accent (bottom-center) -->
  <polygon points="64,98 67,102 64,106 61,102" fill="url(#goldGrad)"/>
</svg>
